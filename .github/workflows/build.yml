# The app is built unsigned, then signed after the build with the Developer ID
# Application certificate from the repository secrets (not notarized yet).
# The signing identity and team ID are read from the imported certificate, so
# nothing about the team is committed to the project settings. Without the
# secrets (e.g. in a fork) the build stays unsigned.
name: Git Release
# XXX: other criteria?
on: [push]
jobs:
  build:
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    runs-on: macos-15
    permissions:
      contents: write # needed to publish/update the "latest" GitHub Release below
    env:
      XCODE_DERIVEDDATA_PATH: build
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install xcpretty
        run: gem install xcpretty --no-document --quiet
      - name: Build Executable
        run: xcodebuild build -configuration Release -project Submariner.xcodeproj -scheme Submariner -arch x86_64 -arch arm64 -derivedDataPath $XCODE_DERIVEDDATA_PATH CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= | xcpretty -c
      - name: Check signing secrets
        id: signing
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
        run: |
          if [ -n "$BUILD_CERTIFICATE_BASE64" ]; then echo "enabled=true" >> "$GITHUB_OUTPUT"; fi
      - name: Import Developer ID certificate
        if: steps.signing.outputs.enabled == 'true'
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          cert="$RUNNER_TEMP/build_certificate.p12"
          keychain="$RUNNER_TEMP/app-signing.keychain-db"
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 -D -o "$cert"
          export KEYCHAIN_PATH="$keychain" CERTIFICATE_PATH="$cert"
          export KEYCHAIN_PASSWORD="$KEYCHAIN_PASSWORD" P12_PASSWORD="$P12_PASSWORD"
          python3 scripts/macos_ci_credentials.py import-certificate
          rm -f "$cert"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$keychain"
      - name: Sign Submariner.app
        if: steps.signing.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          identity="$(security find-identity -v -p codesigning | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -n 1)"
          [ -n "$identity" ] || { echo "no Developer ID Application identity found" >&2; exit 1; }
          app="$XCODE_DERIVEDDATA_PATH/Build/Products/Release/Submariner.app"
          codesign --force --deep --timestamp --entitlements Submariner/Submariner.entitlements --sign "$identity" "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -d --entitlements - "$app"
      - name: Package Release
        run: ditto -c -k --sequesterRsrc --keepParent "$XCODE_DERIVEDDATA_PATH/Build/Products/Release/Submariner.app" "$XCODE_DERIVEDDATA_PATH/Submariner-$GITHUB_SHA.zip"
      - name: Archive Release
        # XXX: best action type?
        uses: actions/upload-artifact@v4
        with:
          name: Submariner-${{ github.sha }}
          path: ${{ env.XCODE_DERIVEDDATA_PATH }}/Submariner-${{ github.sha }}.zip
      # actions/upload-artifact output expires after 90 days and needs a GitHub
      # login to download. Publish a standing GitHub Release too, so there's
      # always one link anyone can download without an account. Rebuilt from
      # master on every push; kept as a pre-release since the app is not
      # notarized (see note at top of this file).
      - name: Publish Latest Release
        if: github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "$XCODE_DERIVEDDATA_PATH/Submariner-$GITHUB_SHA.zip" "$XCODE_DERIVEDDATA_PATH/Submariner-macOS.zip"
          gh release delete latest --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create latest \
            "$XCODE_DERIVEDDATA_PATH/Submariner-macOS.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Latest build" \
            --prerelease \
            --notes "Automatic build of the latest master commit ($GITHUB_SHA). Developer ID signed, not notarized — for testing, not for distribution. Replaced on every push to master."
      - name: Remove signing keychain
        if: always() && steps.signing.outputs.enabled == 'true'
        run: |
          rm -f "$RUNNER_TEMP/build_certificate.p12"
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" || true
