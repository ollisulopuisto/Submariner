# Heavy/strict SwiftLint configuration.
#
# Scope: this is a decades-old imported codebase (Submariner, upstream
# https://github.com/ollisulopuisto/Submariner) with a large amount of
# pre-existing Objective-C-era Swift (~1800 warnings as of writing). Rather
# than drown the signal in legacy noise, or silently skip enforcement
# altogether, this ruleset applies in full to the whole tree, but the
# `excluded` list at the bottom carves out the not-yet-cleaned-up legacy
# files. New files and the locally patched Last.fm feature are NOT
# excluded and must pass `swiftlint lint --strict` (see
# .github/workflows/test.yml). Remove entries from `excluded` as files get
# cleaned up; never add new ones.

opt_in_rules:
  - array_init
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - convenience_type
  - discouraged_optional_boolean
  - empty_count
  - empty_string
  - explicit_init
  - fallthrough
  - fatal_error_message
  - first_where
  - flatmap_over_map_reduce
  - force_unwrapping
  - identical_operands
  - joined_default_parameter
  - last_where
  - legacy_random
  - literal_expression_end_indentation
  - lower_acl_than_parent
  - modifier_order
  - multiline_arguments
  - multiline_parameters
  - operator_usage_whitespace
  - overridden_super_call
  - pattern_matching_keywords
  - prefer_self_type_over_type_of_self
  - redundant_nil_coalescing
  - redundant_type_annotation
  - single_test_class
  - sorted_first_last
  - static_operator
  - strict_fileprivate
  - toggle_bool
  - unavailable_function
  - unneeded_parentheses_in_closure_argument
  - vertical_whitespace_closing_braces
  - vertical_whitespace_opening_braces
  - yoda_condition

disabled_rules:
  - todo # tracked separately; noisy on an inherited codebase

line_length:
  warning: 160
  error: 220

function_body_length:
  warning: 80
  error: 150

cyclomatic_complexity:
  warning: 15
  error: 25

type_body_length:
  warning: 400
  error: 600

file_length:
  warning: 700
  error: 1000

identifier_name:
  min_length: 2
  excluded:
    - id

excluded:
  - Submariner.xcodeproj
  - build
  - upstream
  # Pre-existing files inherited from upstream, not yet brought up to this
  # ruleset. New and locally-patched files (SBLastFM.swift,
  # SBPreferencesController.swift, SubmarinerTests/) are NOT listed here
  # and must stay clean under `swiftlint lint --strict`. Remove entries as
  # files get cleaned up; do not add new files to this list.
